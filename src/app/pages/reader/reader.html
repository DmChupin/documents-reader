<div class="pages-container" (click)="pageClick($event)">
  @for (page of document()?.pages; track $index) {
    <img [src]="page.imageUrl" [alt]="page.number" />
  }

  @for (annotation of annotations(); track $index) {
    <app-annotation
      [annotation]="annotation"
      (delete)="deleteAnnotation($event)"
      (collapse)="collapseAnnotation($event)"
    />
  }
</div>

<app-action-buttons />
